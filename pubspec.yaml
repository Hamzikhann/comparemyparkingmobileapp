name: parkingapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  dropdown_button2: ^2.1.3
  flutter_screenutil: ^5.9.0
  http: ^1.1.0
  dio: ^5.3.2
  pretty_dio_logger: ^1.3.1
  flutter_easyloading: ^3.0.5
  intl: ^0.19.0
  provider: ^6.0.5
  image_picker: ^1.1.2
  file_picker: ^9.0.1
  permission_handler: ^11.0.0
  geolocator: ^11.0.0
  cupertino_icons: ^1.0.8
  flutter_stripe: ^11.5.0
  url_launcher: ^6.3.0
  path: ^1.8.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_auth: ^5.5.3
  flutter_local_notifications: ^19.1.0
  flutter_image_compress: ^2.1.0
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.13.1
  intl_phone_field: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  image_path: "assets/images/logoApp.png"
  ios: true
  android: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo.ttf
